<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Book Covers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loader" id="loader"><div class="loader-ring"></div><div class="loader-text">Assembling Library</div></div>
    <div class="vignette"></div>
    <div id="canvas-container"></div>

    <div class="overlay header">
        <h1>Floating <span>Library</span></h1>
        <p>A curated collection in orbit</p>
    </div>
    <div class="overlay hint">
        <i class="fas fa-arrows-rotate"></i><span>Drag to orbit</span><span class="dot"></span>
        <i class="fas fa-magnifying-glass-plus"></i><span>Scroll to zoom</span><span class="dot"></span>
        <i class="fas fa-hand-pointer"></i><span>Click to explore</span>
    </div>

    <div class="tooltip" id="tooltip" role="tooltip">
        <div class="tip-title" id="tipTitle"></div>
        <div class="tip-author" id="tipAuthor"></div>
        <div class="tip-hint">Click to view details</div>
    </div>

    <div class="book-detail" id="bookDetail" role="dialog" aria-label="Book details">
        <button class="close-btn" id="closeBtn" aria-label="Close details"><i class="fas fa-xmark"></i></button>
        <div class="detail-top">
            <img class="cover-preview" id="detailCover" src="" alt="Book cover">
            <div class="detail-info">
                <div class="book-title" id="detailTitle"></div>
                <div class="book-author" id="detailAuthor"></div>
                <div class="book-rating">
                    <span class="stars" id="detailStars"></span>
                    <span class="rating-num" id="detailRatingNum"></span>
                </div>
            </div>
        </div>
        <div class="divider"></div>
        <div class="book-desc" id="detailDesc"></div>
        <div class="book-meta">
            <div class="meta-item"><span class="meta-label">Published</span><span class="meta-value" id="detailYear"></span></div>
            <div class="meta-item"><span class="meta-label">Format</span><span class="meta-value" id="detailFormat"></span></div>
            <div class="meta-item"><span class="meta-label">Genre</span><span class="meta-value" id="detailGenre"></span></div>
        </div>
        <div class="action-row">
            <a class="action-btn action-btn-primary" id="readBtn" href="#" target="_blank">
                <i class="fas fa-book-open"></i> Read Book
            </a>
            <button class="action-btn action-btn-secondary" id="actionBtn">
                <i class="fas fa-bookmark"></i> Save
            </button>
        </div>
    </div>

    <!-- ADD THIS RIGHT BEFORE THE READER OVERLAY -->
<button class="fab-btn" id="fabBtn" aria-label="Add new book">
    <i class="fas fa-plus"></i>
</button>

<div class="add-modal" id="addModal">
    <div class="add-modal-content">
        <div class="add-modal-header">
            <h2>Add New Book</h2>
            <button class="close-btn" id="addCloseBtn" aria-label="Close"><i class="fas fa-xmark"></i></button>
        </div>
        <form id="addBookForm" class="add-book-form">
            <div class="form-group">
                <label for="newTitle">Title</label>
                <input type="text" id="newTitle" required placeholder="e.g. Dune">
            </div>
            <div class="form-group">
                <label for="newAuthor">Author</label>
                <input type="text" id="newAuthor" required placeholder="e.g. Frank Herbert">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="newYear">Year</label>
                    <input type="number" id="newYear" placeholder="2023">
                </div>
                <div class="form-group">
                    <label for="newGenre">Genre</label>
                    <select id="newGenre">
                        <option value="fiction">Fiction</option>
                        <option value="non-fiction">Non-Fiction</option>
                        <option value="sci-fi">Sci-Fi</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="mystery">Mystery</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Cover Image</label>
                <label class="file-upload-label" for="coverInput">
                    <span id="coverInputText">Choose Image...</span>
                    <i class="fas fa-image"></i>
                </label>
                <input type="file" id="coverInput" accept="image/*" hidden>
                <img class="cover-preview-upload" id="coverPreviewUpload" src="" alt="Preview">
            </div>

            <div class="form-group">
                <label>Book File (PDF/EPUB)</label>
                <label class="file-upload-label" for="bookInput">
                    <span id="bookInputText">Choose File...</span>
                    <i class="fas fa-file-pdf"></i>
                </label>
                <input type="file" id="bookInput" accept=".pdf,.epub" hidden>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-plus-circle"></i> Add to Library
            </button>
        </form>
    </div>
</div>

    <!-- IN-APP READER OVERLAY -->
    <div class="reader-overlay" id="readerOverlay">
        <div class="reader-header">
            <div class="reader-title" id="readerTitle">Reading Book</div>
            <button class="reader-close-btn" id="readerCloseBtn">
                <i class="fas fa-xmark"></i> Close Reader
            </button>
        </div>
        <iframe class="reader-iframe" id="readerIframe" src="" frameborder="0"></iframe>
    </div>

    <!-- Read Books List -->
    <button id="readListBtn" class="read-list-btn">
        <i class="fas fa-book-open"></i>
        <span id="readListBadge" class="read-list-badge">0</span>
    </button>

    <div id="readListOverlay" class="read-list-overlay">
        <div id="readListPanel" class="read-list-panel">
            <div class="read-list-header">
                <h2><i class="fas fa-book-open"></i> Read Books</h2>
                <button id="readListClose" class="read-list-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="readListContent" class="read-list-content"></div>
        </div>
    </div>


    <script type="module" src="/src/main.js"></script>
</body>
</html>
